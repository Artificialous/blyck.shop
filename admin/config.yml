backend:
  name: github
  repo: Artificialous/blyck.shop
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Nur eingeloggte GitHub-Accounts mit Schreibrechten auf dem Repo
# koennen sich hier anmelden -- alle anderen sehen nur die normale,
# statische Seite. Zugriff wird also ueber dein GitHub-Repo geregelt,
# nicht ueber ein separates Passwort.

publish_mode: simple
media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "products"
    label: "Produkte"
    folder: "content/products"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — {{price}} € · Reihenfolge {{order}}"
    fields:
      # ---------- 1. HERO-BEREICH (nur bei den 4 im Hero eingebundenen Produkten sichtbar) ----------
      - label: "Hero-Kicker (kurzes Wort/Label über dem Titel, z. B. 'Neu im Test' — nur sichtbar, wenn dieses Produkt im Hero-Karussell oder in der Promo-Kachel eingebunden ist)"
        name: "heroEyebrow"
        widget: "string"
        required: false
      - label: "Hero-Titel (überschreibt im Hero-Bereich den normalen Produkttitel, z. B. 'Der Schreibtisch 2026' statt 'Monitorarm Gasfeder...')"
        name: "heroTitle"
        widget: "string"
        required: false
        hint: "Leer lassen = Hero zeigt den normalen Produkttitel."
      - label: "Hero-Meta-Zeile (kurze Stichpunkte mit | getrennt, z. B. 'Ergonomisch | Leise | Langlebig')"
        name: "heroMeta"
        widget: "string"
        required: false
      - label: "Eigenes Hero-Bild (optional — nur falls im Karussell/Titelkachel ein anderes Bild als auf der Empfehlungen-Karte erscheinen soll)"
        name: "heroImage"
        widget: "image"
        required: false
        hint: "Leer lassen = Hero zeigt automatisch dasselbe Hauptbild wie die Empfehlungen-Karte. Nur ausfüllen, wenn es abweichen soll."
      - label: "Karussell — Bildgröße in % (100 = füllt den Rahmen genau) — wirkt NUR im Startseiten-Karussell (aktuell p1, p3, p6), nicht in der Titelkachel"
        name: "heroZoom"
        widget: "number"
        value_type: "int"
        required: false
        default: 100
        step: 5
        hint: "Über 100 = größer und näher dran. Unter 100 = kleiner, dann wird der dunkle Rahmenhintergrund am Rand sichtbar. Wirkt immer, unabhängig von den beiden Verschieben-Feldern. Ist dieses Produkt die Titelkachel (aktuell die Schreibtischlampe) statt im Karussell, hat dieses Feld keine Wirkung — dafür die „Titelkachel“-Felder weiter unten benutzen."
      - label: "Karussell — verschieben horizontal in % (0 = mittig, negativ = nach links, positiv = nach rechts) — wirkt NUR im Karussell"
        name: "heroMoveX"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
        hint: "10 verschiebt um ein Zehntel der Rahmenbreite. Wirkt immer — auch bei Bildgröße 100. Ohne Wirkung, wenn dieses Produkt die Titelkachel ist statt im Karussell — dafür die „Titelkachel“-Felder weiter unten."
      - label: "Karussell — verschieben vertikal in % (0 = mittig, negativ = nach oben, positiv = nach unten) — wirkt NUR im Karussell"
        name: "heroMoveY"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
        hint: "Betrifft nur das Karussell. Titelkachel und Empfehlungen-Karte haben ihre eigenen Felder weiter unten."
      - label: "Karussell — KI-Kennzeichnung anzeigen — wirkt NUR im Karussell"
        name: "heroAiBadge"
        widget: "boolean"
        default: false
        hint: "Blendet unten rechts im Karussell-Bild das AI-MODIFIED-Badge ein. Pflicht laut EU AI Act (Art. 50), wenn dieses Bild KI-generiert oder KI-bearbeitet ist. Betrifft nur das Karussell — die Titelkachel hat ihr eigenes Feld direkt darunter."

      # ---------- 1b. PROMO-KACHEL (schmale Kachel neben dem Karussell, aktuell die Schreibtischlampe) ----------
      - label: "Titelkachel — Bildgröße in % (100 = füllt den Rahmen genau)"
        name: "promoZoom"
        widget: "number"
        value_type: "int"
        required: false
        default: 100
        step: 5
        hint: "Nur für die schmale Titelkachel neben dem Karussell. Eigener Wert, unabhängig von der Bildgröße oben im Karussell — die Kachel ist schmal und hoch, das Karussell breit, derselbe Wert würde dort unterschiedlich wirken. Nutzt dasselbe Bild wie oben (Eigenes Hero-Bild bzw. Hauptfoto), nur einen anderen Ausschnitt."
      - label: "Titelkachel — verschieben horizontal in %"
        name: "promoMoveX"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
      - label: "Titelkachel — verschieben vertikal in %"
        name: "promoMoveY"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
      - label: "Titelkachel — KI-Kennzeichnung anzeigen"
        name: "promoAiBadge"
        widget: "boolean"
        default: false
        hint: "Blendet unten rechts in der Titelkachel das AI-MODIFIED-Badge ein. Pflicht laut EU AI Act (Art. 50), wenn dieses Bild KI-generiert oder KI-bearbeitet ist. Betrifft nur die Titelkachel, nicht das Karussell-Bild oben."

      # ---------- 2. EMPFEHLUNGEN-KARTE (Produktkarte im Grid) ----------
      - label: "Produktfotos (erstes Bild = Hauptbild auf Karte, Hero-Fallback und Detailseite; weitere nur auf der Detailseite als Galerie)"
        name: "images"
        widget: "list"
        required: false
        summary: "{{fields.src}}"
        hint: "Ziehen zum Umsortieren, „+“ für ein weiteres Bild. Jedes Bild hat unten eigene Regler für die Detailseite."
        fields:
          - label: "Bild"
            name: "src"
            widget: "image"
            hint: "Kein Amazon-Bild hochladen — nur eigene Fotos oder unabhängig erzeugte KI-Bilder."
          - label: "Bildgröße auf der Detailseite in % (100 = füllt den Rahmen genau)"
            name: "zoom"
            widget: "number"
            value_type: "int"
            required: false
            default: 100
            step: 5
            hint: "Gilt nur für dieses Bild auf der Detailseite (großes Bild + eigene Miniatur) — unabhängig von den Hero- und Karten-Feldern oben, die haben eigene Werte."
          - label: "Verschieben horizontal in % (0 = mittig)"
            name: "moveX"
            widget: "number"
            value_type: "int"
            required: false
            default: 0
            step: 5
          - label: "Verschieben vertikal in % (0 = mittig)"
            name: "moveY"
            widget: "number"
            value_type: "int"
            required: false
            default: 0
            step: 5
          - label: "KI-Kennzeichnung anzeigen"
            name: "aiBadge"
            widget: "boolean"
            required: false
            default: false
            hint: "Blendet unten rechts das AI-MODIFIED-Badge ein, wenn dieses Bild auf der Detailseite als Hauptbild aktiv ist. Pflicht laut EU AI Act (Art. 50), wenn dieses Bild KI-generiert oder KI-bearbeitet ist."
      - label: "Bildgröße auf der Karte in % (100 = füllt den quadratischen Rahmen genau)"
        name: "cardZoom"
        widget: "number"
        value_type: "int"
        required: false
        default: 100
        step: 5
        hint: "Über 100 = größer und näher dran. Unter 100 = kleiner, dann wird der helle Kartenhintergrund am Rand sichtbar. Wirkt immer, unabhängig von den beiden Verschieben-Feldern."
      - label: "Karte — verschieben horizontal in % (0 = mittig, negativ = nach links, positiv = nach rechts)"
        name: "cardMoveX"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
        hint: "10 verschiebt um ein Zehntel der Kartenbreite. Wirkt immer — auch bei Bildgröße 100."
      - label: "Karte — verschieben vertikal in % (0 = mittig, negativ = nach oben, positiv = nach unten)"
        name: "cardMoveY"
        widget: "number"
        value_type: "int"
        required: false
        default: 0
        step: 5
        hint: "Betrifft nur die Karte im Empfehlungen-Grid, unabhängig von den Hero-Feldern oben. Die Karte ist quadratisch, der Hero breit — dieselben Werte wirken dort also unterschiedlich."
      - label: "Karte — KI-Kennzeichnung anzeigen"
        name: "cardAiBadge"
        widget: "boolean"
        default: false
        hint: "Blendet unten rechts auf der Empfehlungen-Karte das AI-MODIFIED-Badge ein. Pflicht laut EU AI Act (Art. 50), wenn dieses Bild KI-generiert oder KI-bearbeitet ist."
      - label: "Platzhalter-Icon (bis echtes Produktfoto da ist)"
        name: "icon"
        widget: "select"
        options: ["p-arm", "p-lamp", "p-grind", "p-key", "p-drip", "p-chair", "p-photo"]
      - { label: "Badge (z. B. Tipp, Neu) — optional", name: "badge", widget: "string", required: false }
      - label: "Kategorie"
        name: "categoryKey"
        widget: "select"
        options:
          - { label: "Arbeitsplatz", value: "arbeitsplatz" }
          - { label: "Kaffee & Küche", value: "kaffee" }
          - { label: "Licht", value: "licht" }
          - { label: "Audio", value: "audio" }
          - { label: "Werkzeug", value: "werkzeug" }
          - { label: "Ordnung", value: "ordnung" }
          - { label: "Reise", value: "reise" }
          - { label: "Pflege", value: "pflege" }
      - { label: "Titel", name: "title", widget: "string" }
      - { label: "Kurzbeschreibung (Kartenansicht, 1 Satz)", name: "shortDesc", widget: "text", required: false }
      - { label: "Klickzahl-Basiswert", name: "baseClicks", widget: "number", value_type: "int", default: 0 }
      - { label: "Preis (nur Zahl, z. B. 89,00)", name: "price", widget: "string" }
      - { label: "Alter Preis (optional, für durchgestrichenen Preis)", name: "oldPrice", widget: "string", required: false }
      - { label: "Preis-Stand (z. B. 06.08.2026)", name: "priceDate", widget: "string" }
      - { label: "Amazon-Affiliate-Link", name: "amazonLink", widget: "string", required: false, hint: "Leer lassen, bis der echte PartnerNet-Link da ist. Ohne Link zeigt der Button nur eine Hinweismeldung." }

      # ---------- 3. DETAILSEITE (nur falls "Eigene Produktseite anlegen?" aktiv) ----------
      - { label: "Eigene Produktseite anlegen?", name: "hasDetailPage", widget: "boolean", default: false }
      - { label: "Ausführlicher Lead-Text (nur Detailseite)", name: "lead", widget: "text", required: false }
      - { label: "Vorteile (nur bei eigener Produktseite)", name: "pros", widget: "list", required: false }
      - { label: "Nachteile (nur bei eigener Produktseite)", name: "cons", widget: "list", required: false }
      - label: "Verwandte Produkte (nur bei eigener Produktseite, sonst automatisch)"
        name: "relatedIds"
        widget: "relation"
        collection: "products"
        search_fields: ["title"]
        value_field: "id"
        display_fields: ["title"]
        multiple: true
        required: false

      # ---------- 4. VERWALTUNG / INTERN ----------
      - { label: "Sichtbar auf der Seite", name: "published", widget: "boolean", default: true }
      - { label: "Reihenfolge (kleiner = weiter vorne)", name: "order", widget: "number", value_type: "int", default: 99 }
      - { label: "Produkt-ID (intern, nie aendern)", name: "id", widget: "string", pattern: ["^p[0-9]+$", "Format: p gefolgt von einer Zahl, z. B. p7"] }
      - { label: "URL-Slug (fuer die Adresse der Detailseite)", name: "slug", widget: "string" }

  - name: "articles"
    label: "Magazin-Artikel"
    folder: "content/articles"
    create: true
    slug: "{{fields.slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Sichtbar auf der Seite", name: "published", widget: "boolean", default: true }
      - { label: "Artikel-ID (intern, nie aendern)", name: "id", widget: "string", pattern: ["^a[0-9]+$", "Format: a gefolgt von einer Zahl, z. B. a2"] }
      - { label: "URL-Slug (fuer die Adresse des Artikels)", name: "slug", widget: "string" }
      - { label: "Titel", name: "title", widget: "string" }
      - label: "Kategorie"
        name: "categoryKey"
        widget: "select"
        options:
          - { label: "Arbeitsplatz", value: "arbeitsplatz" }
          - { label: "Kaffee & Küche", value: "kaffee" }
          - { label: "Licht", value: "licht" }
          - { label: "Audio", value: "audio" }
          - { label: "Werkzeug", value: "werkzeug" }
          - { label: "Ordnung", value: "ordnung" }
          - { label: "Reise", value: "reise" }
          - { label: "Pflege", value: "pflege" }
      - { label: "Datum", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Datum, Tag (z. B. 06)", name: "dateDay", widget: "string" }
      - { label: "Datum, Monat + Jahr (z. B. Aug 2026)", name: "dateMonthYear", widget: "string" }
      - { label: "Lesezeit (z. B. 4 Min. Lesezeit)", name: "readTime", widget: "string" }
      - label: "Platzhalter-Titelbild (bis echtes Foto da ist)"
        name: "cover"
        widget: "select"
        options: ["p-photo", "p-arm", "p-lamp", "p-grind"]
      - { label: "Titelbild (ersetzt das Platzhalter-Icon, sobald vorhanden)", name: "coverImage", widget: "image", required: false, hint: "Kein Amazon-Bild hochladen — nur eigene Fotos oder KI-generierte Bilder, die nicht vom Amazon-Foto abgeleitet sind." }
      - { label: "Teaser-Text (Kartenansicht auf der Startseite)", name: "teaser", widget: "text" }
      - { label: "Einleitung (erster Absatz im Artikel)", name: "intro", widget: "text" }
      - label: "Abschnitte"
        name: "sections"
        widget: "list"
        fields:
          - { label: "Überschrift", name: "heading", widget: "string" }
          - { label: "Text", name: "text", widget: "text" }
          - { label: "Produkt einbetten (Produkt-ID, optional)", name: "embedProductId", widget: "string", required: false }

  - name: "settings"
    label: "Einstellungen"
    files:
      - label: "Kontakt & Website"
        name: "site"
        file: "_data/site.json"
        fields:
          - { label: "Seitenname", name: "name", widget: "string" }
          - { label: "Domain (mit https://)", name: "domain", widget: "string" }
          - { label: "Kontakt-E-Mail", name: "email", widget: "string" }
          - { label: "Standard-Seitentitel", name: "defaultTitle", widget: "string" }
          - { label: "Standard-Beschreibung", name: "defaultDescription", widget: "text" }
          - { label: "Standard-Vorschaubild (Pfad ab Projektordner)", name: "defaultOgImage", widget: "string" }
